<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статьи — WorkNest</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/icon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div id="clouds">
        <div class="cloud x1"></div>
        <div class="cloud x2"></div>
        <div class="cloud x3"></div>
        <div class="cloud x4"></div>
        <div class="cloud x5"></div>
        <div class="cloud x6"></div>
        <div class="cloud x7"></div>
        <div class="cloud x8"></div>
        <div class="cloud x9"></div>
        <div class="cloud x10"></div>
    </div>
    <header>
        <div class="header-inner">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Логотип" class="logo">
            <h1>WorkNest</h1>
            <form class="header-search" action="/search" method="get">
                <input type="text" name="q" placeholder="Поиск..." aria-label="Поиск">
                <button type="submit" title="Найти">
                    <img src="{{ url_for('static', filename='img/font-search.svg') }}" alt="Поиск" class="search-icon-img">
                </button>
            </form>
            <nav class="header-nav">
                <ul>
                    <li><a href="/">Главная</a></li>
                    <li><a href="/articles">Статьи</a></li>
                    <li><a href="/wall">Стена</a></li>
                </ul>
            </nav>
            <div class="header-user">
              {% if current_user %}
                <span class="header-username">{{ current_user.username }}</span>
                <button class="header-burger" id="headerBurgerBtn" aria-label="Меню">
                  <span class="burger-icon">
                    <span></span>
                    <span></span>
                    <span></span>
                  </span>
                </button>
                <div class="header-dropdown" id="headerDropdown">
                  <a href="/profile">Профиль</a>
                  <a href="/logout">Выйти</a>
                </div>
              {% else %}
                <a href="/reg_login" class="header-login-link">Войти</a>
              {% endif %}
            </div>
        </div>
    </header>
    <div class="app-bg">
        <main>
            <div class="container">
                <div class="section-block" style="text-align:center; min-height:40vh; display:flex; flex-direction:column; justify-content:center; align-items:center;">
                    <div class="section-title">Статьи</div>
                    <p style="font-size:1.2em; color:#4db6e2; margin:32px 0;">Раздел в разработке.<br>Скоро здесь появятся интересные публикации!</p>
                </div>
            </div>
        </main>
    </div>
    <footer>
        <div class="container">
            <p>© 2025 <span class="footer-brand">WorkNest</span></p>
        </div>
    </footer>
    <script src="{{ url_for('static', filename='header-burger.js') }}"></script>
    <script>
document.addEventListener('DOMContentLoaded', function() {
  const burger = document.getElementById('headerBurgerBtn');
  const dropdown = document.getElementById('headerDropdown');
  if (burger && dropdown) {
    burger.onclick = function(e) {
      e.stopPropagation();
      dropdown.classList.toggle('active');
    };
    document.body.onclick = function() {
      dropdown.classList.remove('active');
    };
  }
});
</script>
</body>
</html>
