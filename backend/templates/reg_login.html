{% extends "base.html" %}

{% block title %}Авторизация - WorkNest{% endblock %}

{% block content %}
<div class="auth-container fade-in">
    <div class="auth-card">
        <!-- Заголовок -->
        <div class="auth-header">
            <h1>Добро пожаловать в WorkNest</h1>
            <p>Войдите в свой аккаунт или создайте новый</p>
        </div>

        <!-- Переключатель между формами -->
        <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login">Вход</button>
            <button class="auth-tab" data-tab="register">Регистрация</button>
        </div>

        <!-- Форма входа -->
        <div class="auth-form" id="login-form">
            <form method="POST" action="/reg_login">
                <div class="form-group">
                    <label for="username" class="form-label">Имя пользователя</label>
                    <input type="text" 
                           id="username" 
                           name="username" 
                           class="form-input" 
                           required 
                           placeholder="Введите ваше имя пользователя">
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Пароль</label>
                    <input type="password" 
                           id="password" 
                           name="password" 
                           class="form-input" 
                           required 
                           placeholder="Введите ваш пароль">
                </div>

                <button type="submit" class="btn btn-primary auth-submit">
                    Войти
                </button>
            </form>
        </div>

        <!-- Форма регистрации -->
        <div class="auth-form" id="register-form" style="display: none;">
            <form method="POST" action="/register">
                <div class="form-group">
                    <label for="reg-username" class="form-label">Имя пользователя</label>
                    <input type="text" 
                           id="reg-username" 
                           name="username" 
                           class="form-input" 
                           required 
                           placeholder="Выберите имя пользователя">
                </div>

                <div class="form-group">
                    <label for="reg-email" class="form-label">Email</label>
                    <input type="email" 
                           id="reg-email" 
                           name="email" 
                           class="form-input" 
                           required 
                           placeholder="Введите ваш email">
                </div>

                <div class="form-group">
                    <label for="reg-password" class="form-label">Пароль</label>
                    <input type="password" 
                           id="reg-password" 
                           name="password" 
                           class="form-input" 
                           required 
                           placeholder="Создайте надежный пароль">
                </div>

                <div class="form-group">
                    <label for="reg-full-name" class="form-label">Полное имя (необязательно)</label>
                    <input type="text" 
                           id="reg-full-name" 
                           name="full_name" 
                           class="form-input" 
                           placeholder="Ваше полное имя">
                </div>

                <button type="submit" class="btn btn-primary auth-submit">
                    Зарегистрироваться
                </button>
            </form>
        </div>

        <!-- Дополнительные ссылки -->
        <div class="auth-footer">
            <p>Нет аккаунта? <a href="#" class="auth-link" data-tab="register">Зарегистрируйтесь</a></p>
            <p>Уже есть аккаунт? <a href="#" class="auth-link" data-tab="login">Войдите</a></p>
        </div>
    </div>
</div>

<!-- Стили для страницы авторизации -->
<style>
.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 70vh;
    padding: 2rem 0;
}

.auth-card {
    background-color: #1e1e1e;
    border: 1px solid #2c2c2c;
    border-radius: 16px;
    padding: 2.5rem;
    width: 100%;
    max-width: 450px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    position: relative;
}

.auth-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(45deg, #00e1d3, #00b8cc);
    border-radius: 16px 16px 0 0;
}

.auth-header {
    text-align: center;
    margin-bottom: 2rem;
}

.auth-header h1 {
    font-size: 1.8rem;
    color: #f0f0f0;
    margin-bottom: 0.5rem;
}

.auth-header p {
    color: #888;
    font-size: 1rem;
}

.auth-tabs {
    display: flex;
    margin-bottom: 2rem;
    background-color: #2c2c2c;
    border-radius: 8px;
    padding: 4px;
}

.auth-tab {
    flex: 1;
    padding: 0.75rem;
    border: none;
    background: transparent;
    color: #888;
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.3s ease;
    font-weight: 500;
}

.auth-tab.active {
    background: linear-gradient(45deg, #00e1d3, #00b8cc);
    color: #fff;
}

.auth-tab:hover:not(.active) {
    color: #f0f0f0;
    background-color: #3c3c3c;
}

.auth-form {
    animation: fadeIn 0.3s ease-in-out;
}

.auth-submit {
    width: 100%;
    padding: 1rem;
    font-size: 1rem;
    margin-top: 1rem;
}

.auth-footer {
    text-align: center;
    margin-top: 2rem;
    padding-top: 2rem;
    border-top: 1px solid #2c2c2c;
}

.auth-footer p {
    color: #888;
    margin: 0.5rem 0;
}

.auth-link {
    color: #00e1d3;
    text-decoration: none;
    cursor: pointer;
    transition: color 0.3s ease;
}

.auth-link:hover {
    color: #00b8cc;
    text-decoration: underline;
}

@media (max-width: 480px) {
    .auth-card {
        padding: 2rem 1.5rem;
        margin: 0 1rem;
    }
    
    .auth-header h1 {
        font-size: 1.5rem;
    }
}
</style>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const tabs = document.querySelectorAll('.auth-tab');
    const forms = document.querySelectorAll('.auth-form');
    const authLinks = document.querySelectorAll('.auth-link');
    
    function switchTab(tabName) {
        // Переключаем активные табы
        tabs.forEach(tab => {
            tab.classList.toggle('active', tab.dataset.tab === tabName);
        });
        
        // Переключаем формы
        forms.forEach(form => {
            form.style.display = form.id === `${tabName}-form` ? 'block' : 'none';
        });
        
        // Обновляем ссылки в футере
        authLinks.forEach(link => {
            const isRegisterLink = link.dataset.tab === 'register';
            const isLoginTab = tabName === 'login';
            
            if (isRegisterLink && isLoginTab) {
                link.parentElement.style.display = 'block';
            } else if (!isRegisterLink && !isLoginTab) {
                link.parentElement.style.display = 'block';
            } else {
                link.parentElement.style.display = 'none';
            }
        });
    }
    
    // Обработчики для табов
    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            switchTab(tab.dataset.tab);
        });
    });
    
    // Обработчики для ссылок
    authLinks.forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            switchTab(link.dataset.tab);
        });
    });
    
    // Инициализация
    switchTab('login');
});
</script>
{% endblock %}
